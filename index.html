<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XML JSON Conversion Kit</title>
<style>body{font:17px/1.6 system-ui;max-width:1000px;margin:40px auto;padding:0 24px;color:#183047}textarea{box-sizing:border-box;width:100%;height:220px;font:15px/1.5 monospace;padding:12px}button{padding:10px 18px;margin:16px 8px 16px 0}pre{white-space:pre-wrap}label{display:block;font-weight:bold}a{color:#165bc1}</style></head><body>
<h1>XML JSON Conversion Kit</h1><p>A small local converter for record-shaped XML. No dependencies, uploads, or storage.</p>
<p>Not lossless: text is trimmed, mixed-content order and comments are discarded. DTDs and reserved child names are rejected. See <a href="CHECKLIST.md">the checklist</a> and <a href="tests.html">run the fixtures</a>.</p>
<label for="input">XML input</label><textarea id="input" spellcheck="false">&lt;orders&gt;&lt;order id="007"&gt;&lt;total&gt;12.50&lt;/total&gt;&lt;/order&gt;&lt;order id="008"&gt;&lt;total&gt;0&lt;/total&gt;&lt;/order&gt;&lt;/orders&gt;</textarea>
<button id="convert">Convert to JSON</button><button id="download">Download JSON</button><p id="status" role="status"></p>
<label for="output">JSON output</label><textarea id="output" readonly></textarea>
<script src="core.js"></script><script>
const input=document.getElementById('input'), output=document.getElementById('output'), status=document.getElementById('status');
document.getElementById('convert').onclick=()=>{try{output.value=JSON.stringify(XmlJsonKit.convert(input.value),null,2);status.textContent='Converted locally.';}catch(e){output.value='';status.textContent=e.message;}};
document.getElementById('download').onclick=()=>{if(!output.value){status.textContent='Convert a document first.';return;}const u=URL.createObjectURL(new Blob([output.value],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='converted.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
</script></body></html>
